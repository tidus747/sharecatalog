[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sharecatalog"
version = "0.1.0"
description = "Editable document catalogs from Everything with explicit SharePoint mappings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ShareCatalog contributors"}]
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
sharecatalog = "sharecatalog.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
